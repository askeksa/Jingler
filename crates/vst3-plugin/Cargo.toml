[package]
name = "vst3-plugin"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nice-plug = { version = "0.4", default-features = false, features = ["vst3", "tracing-subscriber", "editor"] }
nice-plug-egui = "0.5"
egui = "0.36"
bincode = "1.3"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

ir = { path = "../ir" }
runtime = { path = "../runtime" }
